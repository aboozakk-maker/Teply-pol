<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тёплый пол — расчёт трубы</title>
<meta name="theme-color" content="#16232f">
<meta name="description" content="Расчёт длины трубы для тёплого пола по площади и шагу укладки">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1b26;
    --bg-card:#16232f;
    --bg-field:#1d2e3d;
    --line:#2a3d4d;
    --text:#eaf1f6;
    --text-dim:#93a7b5;
    --accent:#e8734a;
    --accent-dim:#c85a35;
    --accent-soft:rgba(232,115,74,0.14);
    --ok:#4ab68a;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 18px;
    background:linear-gradient(180deg,#182838 0%, #0f1b26 100%);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-size:23px;
    font-weight:600;
    margin:0;
    line-height:1.3;
  }
  main{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 0;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 16px;
    margin-bottom:14px;
  }
  .field{
    margin-bottom:16px;
  }
  .field:last-child{margin-bottom:0;}
  label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  label .hint{
    font-size:12px;
    color:var(--text-dim);
    opacity:0.75;
  }
  input[type=number]{
    width:100%;
    background:var(--bg-field);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    font-size:17px;
    color:var(--text);
    font-family:var(--font);
    -webkit-appearance:none;
  }
  input[type=number]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .step-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .step-btn{
    flex:1 1 auto;
    min-width:52px;
    background:var(--bg-field);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 6px;
    color:var(--text-dim);
    font-size:14px;
    font-family:var(--font);
    text-align:center;
    cursor:pointer;
  }
  .step-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
    font-weight:600;
  }
  .result-card{
    background:linear-gradient(135deg, #21384a 0%, #16232f 100%);
    border:1px solid var(--accent-dim);
    border-radius:14px;
    padding:22px 18px;
    margin-bottom:14px;
  }
  .result-label{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .result-value{
    font-size:38px;
    font-weight:600;
    color:var(--accent);
    line-height:1.1;
  }
  .result-value span{
    font-size:18px;
    color:var(--text-dim);
    font-weight:400;
    margin-left:4px;
  }
  .breakdown{
    margin-top:16px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--text-dim);
    padding:5px 0;
  }
  .breakdown-row b{
    color:var(--text);
    font-weight:500;
  }
  .warn{
    margin-top:14px;
    background:rgba(232,115,74,0.1);
    border:1px solid var(--accent-dim);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    color:var(--accent);
    line-height:1.5;
  }
  .loops{
    margin-top:14px;
    background:rgba(74,182,138,0.1);
    border:1px solid var(--ok);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    color:var(--ok);
    line-height:1.5;
  }
  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:20px 16px;
    line-height:1.6;
  }
  .install-banner{
    display:none;
    max-width:480px;
    margin:0 auto 14px;
    padding:12px 14px;
    background:var(--accent-soft);
    border:1px solid var(--accent-dim);
    border-radius:12px;
    font-size:13px;
    color:var(--text);
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .install-banner.show{display:flex;}
  .install-btn{
    background:var(--accent);
    color:#16232f;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    font-family:var(--font);
    white-space:nowrap;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Тёплый пол</p>
  <h1>Расчёт длины трубы</h1>
</header>

<div class="install-banner" id="installBanner">
  <span>Установите приложение на телефон</span>
  <button class="install-btn" id="installBtn">Установить</button>
</div>

<main>

  <div class="card">
    <div class="field">
      <label>Площадь помещения <span class="hint">м²</span></label>
      <input type="number" id="area" inputmode="decimal" placeholder="Например, 18" min="0" step="0.1">
    </div>

    <div class="field">
      <label>Шаг укладки трубы <span class="hint">см</span></label>
      <div class="step-row" id="stepRow">
        <div class="step-btn" data-step="10">10</div>
        <div class="step-btn active" data-step="15">15</div>
        <div class="step-btn" data-step="20">20</div>
        <div class="step-btn" data-step="25">25</div>
        <div class="step-btn" data-step="30">30</div>
      </div>
    </div>

    <div class="field">
      <label>Своё значение шага <span class="hint">см, необязательно</span></label>
      <input type="number" id="customStep" inputmode="decimal" placeholder="если нужен точный шаг" min="1" step="0.5">
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Расстояние до коллектора <span class="hint">м</span></label>
      <input type="number" id="manifold" inputmode="decimal" placeholder="0" min="0" step="0.1" value="0">
    </div>

    <div class="field">
      <label>Запас на изгибы и огибание препятствий <span class="hint">%</span></label>
      <input type="number" id="margin" inputmode="decimal" placeholder="10" min="0" step="1" value="10">
    </div>

    <div class="field">
      <label>Макс. длина одного контура <span class="hint">м, для расчёта петель</span></label>
      <input type="number" id="maxLoop" inputmode="decimal" placeholder="100" min="1" step="1" value="100">
    </div>
  </div>

  <div class="result-card">
    <div class="result-label">Итого трубы нужно</div>
    <div class="result-value" id="totalResult">0<span>м</span></div>

    <div class="breakdown">
      <div class="breakdown-row"><span>Труба в контуре пола</span> <b id="baseVal">—</b></div>
      <div class="breakdown-row"><span>Подводка до коллектора</span> <b id="leadVal">—</b></div>
      <div class="breakdown-row"><span>Запас</span> <b id="marginVal">—</b></div>
    </div>

    <div class="loops" id="loopsBox" style="display:none;"></div>
    <div class="warn" id="warnBox" style="display:none;"></div>
  </div>

</main>

<footer>
  Расчёт приблизительный. Для точного проекта учитывайте реальную геометрию помещения и рекомендации производителя трубы.
</footer>

<script>
  const areaInput = document.getElementById('area');
  const customStepInput = document.getElementById('customStep');
  const manifoldInput = document.getElementById('manifold');
  const marginInput = document.getElementById('margin');
  const maxLoopInput = document.getElementById('maxLoop');
  const stepRow = document.getElementById('stepRow');

  let selectedStep = 15;

  stepRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.step-btn');
    if(!btn) return;
    document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStep = parseFloat(btn.dataset.step);
    customStepInput.value = '';
    calculate();
  });

  customStepInput.addEventListener('input', () => {
    if(customStepInput.value){
      document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
    } else {
      document.querySelector(`.step-btn[data-step="${selectedStep}"]`)?.classList.add('active');
    }
    calculate();
  });

  [areaInput, manifoldInput, marginInput, maxLoopInput].forEach(el => {
    el.addEventListener('input', calculate);
  });

  function calculate(){
    const area = parseFloat(areaInput.value) || 0;
    const step = parseFloat(customStepInput.value) || selectedStep;
    const manifold = parseFloat(manifoldInput.value) || 0;
    const margin = parseFloat(marginInput.value) || 0;
    const maxLoop = parseFloat(maxLoopInput.value) || 0;

    const stepM = step / 100;
    const baseLength = stepM > 0 ? area / stepM : 0;
    const leadLength = manifold * 2;
    const marginLength = baseLength * (margin / 100);
    const total = baseLength + leadLength + marginLength;

    document.getElementById('totalResult').innerHTML = total > 0
      ? total.toFixed(1) + '<span>м</span>'
      : '0<span>м</span>';
    document.getElementById('baseVal').textContent = baseLength.toFixed(1) + ' м';
    document.getElementById('leadVal').textContent = leadLength.toFixed(1) + ' м';
    document.getElementById('marginVal').textContent = marginLength.toFixed(1) + ' м';

    const warnBox = document.getElementById('warnBox');
    const loopsBox = document.getElementById('loopsBox');

    if(maxLoop > 0 && total > maxLoop){
      const loopsNeeded = Math.ceil(total / maxLoop);
      loopsBox.style.display = 'block';
      loopsBox.textContent = `Рекомендуется разбить на ${loopsNeeded} контура(ов), примерно по ${(total/loopsNeeded).toFixed(1)} м каждый.`;
      warnBox.style.display = 'none';
    } else if(total > 0){
      loopsBox.style.display = 'block';
      loopsBox.textContent = `Укладывается одним контуром (до ${maxLoop || '—'} м).`;
      warnBox.style.display = 'none';
    } else {
      loopsBox.style.display = 'none';
    }

    if(step < 10){
      warnBox.style.display = 'block';
      warnBox.textContent = 'Шаг менее 10 см применяется редко — проверьте значение.';
    }
  }

  calculate();

  // PWA install prompt
  let deferredPrompt;
  const banner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add('show');
  });

  installBtn?.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    banner.classList.remove('show');
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
